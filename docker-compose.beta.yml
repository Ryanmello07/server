services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./beta-vault/beta-secrets.env
    # No host port binding; only needed inside the Docker network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    env_file:
      - ./beta-vault/beta-secrets.env
    command: >
      sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    # No host port binding; only needed inside the Docker network.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../
      dockerfile: server/Dockerfile.beta
    environment:
      WARP_ENV: local
      WARP_BLOCK: local
      WARP_SERVICE: bringyourctl
      WARP_VERSION: 0.0.0-beta
      WARP_HOST: 127.0.0.1
      BRINGYOUR_POSTGRES_HOSTNAME: postgres
      BRINGYOUR_REDIS_HOSTNAME: redis
      WARP_HOME: /srv/warp
    command: ["bringyourctl", "db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./beta-vault:/srv/warp:ro

  taskworker:
    build:
      context: ../
      dockerfile: server/Dockerfile.beta
    restart: unless-stopped
    environment:
      WARP_ENV: local
      WARP_BLOCK: local
      WARP_SERVICE: taskworker
      WARP_VERSION: 0.0.0-beta
      WARP_HOST: 127.0.0.1
      BRINGYOUR_POSTGRES_HOSTNAME: postgres
      BRINGYOUR_REDIS_HOSTNAME: redis
      WARP_HOME: /srv/warp
    command: ["taskworker", "--count=2", "--batch_size=2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./beta-vault:/srv/warp:ro

  api:
    build:
      context: ../
      dockerfile: server/Dockerfile.beta
    restart: unless-stopped
    environment:
      WARP_ENV: local
      WARP_BLOCK: local
      WARP_SERVICE: api
      WARP_VERSION: 0.0.0-beta
      # Beta: bind to the public host IP so external clients can reach the API.
      WARP_HOST: "${PUBLIC_IP:-127.0.0.1}"
      BRINGYOUR_POSTGRES_HOSTNAME: postgres
      BRINGYOUR_REDIS_HOSTNAME: redis
      WARP_HOME: /srv/warp
    command: ["api", "--port=8080"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./beta-vault:/srv/warp:ro

  connect:
    build:
      context: ../
      dockerfile: server/Dockerfile.beta
    restart: unless-stopped
    environment:
      WARP_ENV: local
      WARP_BLOCK: local
      WARP_SERVICE: connect
      WARP_VERSION: 0.0.0-beta
      # Beta: bind to the public host IP so external clients can reach the connect websocket.
      WARP_HOST: "${PUBLIC_IP:-127.0.0.1}"
      BRINGYOUR_POSTGRES_HOSTNAME: postgres
      BRINGYOUR_REDIS_HOSTNAME: redis
      WARP_HOME: /srv/warp
      WARP_PORTS: "80:5080,15080:15080"
    command: ["connect", "--port=80"]
    ports:
      - "5080:80"
      - "15080:15080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./beta-vault:/srv/warp:ro

volumes:
  postgres_data:
