services:
  postgres:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    image: postgres:16
    restart: unless-stopped
    # Docker defaults /dev/shm to 64MB. Postgres allocates shared memory
    # segments there for parallel workers, and a parallel index vacuum on the
    # larger tables asks for a 64MiB segment -- which fails outright:
    #   ERROR: could not resize shared memory segment ... No space left on device
    # Found 2026-09-15 with network_client_location_reliability holding 27k live
    # rows against 3.1M dead ones (11,000% bloat) in a table the provider
    # location pass rewrites every few seconds. Manual VACUUM failed until run
    # with PARALLEL 0, and parallel queries hit the same ceiling.
    shm_size: 1gb
    env_file:
      - ./beta-vault/beta-secrets.env
    # ⚠️ DATA PERSISTENCE: uses a named volume (postgres_data) that survives
    # 'docker compose up --force-recreate'. It is DESTROYED by 'docker compose down -v'
    # or 'docker compose rm -v postgres'. Use ./beta-db-backup.sh before volatile ops.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    image: redis:7
    restart: unless-stopped
    env_file:
      - ./beta-vault/beta-secrets.env
    # memory budget: redis ran uncapped with policy `noeviction` and grew to
    # 4.0G (peak 4.6G) on the old 7.9G box, which is what the kernel OOM-killer
    # kept killing -- every kill dropped the precomputed score sets and stranded
    # UpdateClientScores mid-run. The cap is a ceiling above the legitimate
    # working set, not a target.
    #
    # 6gb sized for this 15.9G host. It was 3gb on the old 7.9G box, where
    # `connect` (which holds per-provider connection state and grew to 2.4G)
    # left no room for more. Measured here at ~2G used with 0 evictions.
    #
    # volatile-lru, NOT allkeys-lru: 97.6% of keys (797k of 817k) carry a TTL,
    # so there is always an eviction candidate, and the ~20k persistent keys are
    # never touched. allkeys-lru could evict those.
    command: >
      sh -c "redis-server --requirepass $$REDIS_PASSWORD
      --maxmemory 6gb --maxmemory-policy volatile-lru"
    # No host port binding; only needed inside the Docker network.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: ../
      dockerfile: server/Dockerfile.beta
    restart: no
    environment:
      WARP_ENV: local
      # Required since the 2026-09-15 upstream merge: server.RequireDomain()
      # panics when unset, which crash-looped the taskworker on deploy.
      # This is the suffix the beta hostnames hang off (api.beta-test.net).
      WARP_DOMAIN: beta-test.net
      WARP_BLOCK: local
      WARP_SERVICE: bringyourctl
      WARP_VERSION: 0.0.0-beta
      WARP_HOST: 127.0.0.1
      BRINGYOUR_POSTGRES_HOSTNAME: postgres
      BRINGYOUR_REDIS_HOSTNAME: redis
      WARP_HOME: /srv/warp
    command: ["bringyourctl", "db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./beta-vault:/srv/warp:ro

  taskworker:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: ../
      dockerfile: server/Dockerfile.beta
    restart: unless-stopped
    environment:
      WARP_ENV: local
      WARP_DOMAIN: beta-test.net
      WARP_BLOCK: local
      WARP_SERVICE: taskworker
      WARP_VERSION: 0.0.0-beta
      WARP_HOST: 127.0.0.1
      BRINGYOUR_POSTGRES_HOSTNAME: postgres
      BRINGYOUR_REDIS_HOSTNAME: redis
      WARP_HOME: /srv/warp
    command: ["taskworker", "--count=2", "--batch_size=2"]
    # Waits for migrate like api and connect. Since the 2026-10-06 merge a
    # taskworker that starts against an older schema latches "not ready", and
    # migration 744's settlement guard fails any writer older than the schema.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./beta-vault:/srv/warp:ro

  api:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: ../
      dockerfile: server/Dockerfile.beta
    restart: unless-stopped
    environment:
      # The ingress proxy (caddy) reaches api from this bridge. Without it,
      # ResolveClientAddress falls back to caddy's own address and EVERY client
      # in the deployment shares one signup budget -- which is what wedged
      # signups on both deployments. Enumerating it is what makes the
      # forwarded client address readable at all.
      BRINGYOUR_TRUSTED_PROXY_CIDRS: "172.18.0.0/16"
      WARP_ENV: local
      WARP_DOMAIN: beta-test.net
      WARP_BLOCK: local
      WARP_SERVICE: api
      WARP_VERSION: 0.0.0-beta
      # Beta: bind to the public host IP so external clients can reach the API.
      WARP_HOST: "${PUBLIC_IP:-127.0.0.1}"
      BRINGYOUR_POSTGRES_HOSTNAME: postgres
      BRINGYOUR_REDIS_HOSTNAME: redis
      WARP_HOME: /srv/warp
    command: ["api", "--port=8080"]
    # No published port. Caddy terminates tls for api.beta-test.net and is the
    # only ingress; publishing 8080 would let a client reach the api over plain
    # http and bypass the forwarded-address headers connect and the api rely on
    # to see the real client address.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./beta-vault:/srv/warp:ro

  connect:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: ../
      dockerfile: server/Dockerfile.beta
    restart: unless-stopped
    environment:
      WARP_ENV: local
      WARP_DOMAIN: beta-test.net
      WARP_BLOCK: local
      WARP_SERVICE: connect
      WARP_VERSION: 0.0.0-beta
      # Beta: bind to the public host IP so external clients can reach the connect websocket.
      WARP_HOST: "${PUBLIC_IP:-127.0.0.1}"
      BRINGYOUR_POSTGRES_HOSTNAME: postgres
      BRINGYOUR_REDIS_HOSTNAME: redis
      WARP_HOME: /srv/warp
      WARP_PORTS: "80:5080,15080:15080"
    command: ["connect", "--port=80"]
    # No published ports. Caddy terminates tls for connect.beta-test.net and is
    # the only ingress. This is load-bearing beyond transport security: connect
    # only trusts a forwarded client address when it receives BOTH
    # X-Forwarded-For and X-Forwarded-Source-Port (connect/transport.go:220),
    # and otherwise falls back to the raw peer address. A client arriving on a
    # published port presents the docker gateway address, which is private, has
    # no mmdb entry, and yields "Unknown location type" -- so no location row is
    # written and the provider never appears in the provider list.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./beta-vault:/srv/warp:ro

  # The proxy server: socks/http/https/api/wg endpoints that proxy clients are
  # pointed at by CreateProxyClient. It is NOT behind caddy -- it terminates its
  # own TLS, reading the cert for proxy.beta-test.net from the vault at
  # tls/proxy.beta-test.net/ (server/tls.go). Caddy holds a block for that name
  # purely so ACME issues and renews the certificate.
  #
  # The published ports MUST match the port numbers in the vault's proxy.yml
  # `hosts` block, because those are the numbers baked into the URLs handed to
  # clients. The container-side ports are fixed constants (proxy/server.go:41-45)
  # and are not configurable.
  proxy:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: ../
      dockerfile: server/Dockerfile.beta
    restart: unless-stopped
    # --port is the STATUS listener only (GET /status). It must not collide with
    # the five fixed service ports the proxy also binds (8080 socks, 8081 http,
    # 8082 https, 8083 api, 8084 wg -- proxy/server.go:41-45). The binary's
    # default of 80 would also collide with caddy if host networking were used.
    command: ["proxy", "--port=8090"]
    env_file:
      - ./beta-vault/beta-secrets.env
    environment:
      WARP_ENV: local
      WARP_DOMAIN: beta-test.net
      WARP_BLOCK: local
      WARP_SERVICE: proxy
      WARP_VERSION: 0.0.0-beta
      WARP_HOST: 127.0.0.1
      BRINGYOUR_POSTGRES_HOSTNAME: postgres
      BRINGYOUR_REDIS_HOSTNAME: redis
      WARP_HOME: /srv/warp
    volumes:
      - ./beta-vault:/srv/warp:ro
    ports:
      - "9080:8080"      # socks
      - "9081:8081"      # http
      - "9082:8082"      # https
      - "9083:8083"      # api
      - "9084:8084/udp"  # wireguard
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # persists issued Let's Encrypt certs across restarts so a redeploy
      # doesn't re-request them (ACME rate limits are per-domain per-week)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - connect

volumes:
  # ⚠️ Named volume that persists Postgres data across container restarts.
  # Deleting this volume destroys ALL user data. Back up before teardown:
  #   ./beta-db-backup.sh
  postgres_data:
  caddy_data:
  caddy_config:
  redis_data:
